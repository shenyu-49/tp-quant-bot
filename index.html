<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TP量化机器人</title>
    <style>
        :root {
            --bg: #0a0e1a;
            --card: #111827;
            --border: rgba(255,255,255,0.06);
            --primary: #3b82f6;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --text: #f1f5f9;
            --muted: #64748b;
            --green: #22c55e;
            --red: #f43f5e;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
            min-height: 100vh;
            font-size: 14px;
        }
        .container { max-width: 500px; margin: 0 auto; padding: 12px; }
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            margin-bottom: 12px;
            overflow: hidden;
        }
        .card-header {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            font-weight: 600;
        }
        .card-body { padding: 16px; }
        .price-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
        .price-item {
            background: rgba(255,255,255,0.03);
            border-radius: 12px;
            padding: 12px 8px;
            text-align: center;
        }
        .price-item .sym { font-size: 11px; color: var(--muted); margin-bottom: 4px; }
        .price-item .val { font-size: 15px; font-weight: 700; }
        .price-item .sig { font-size: 10px; margin-top: 4px; padding: 2px 6px; border-radius: 8px; display: inline-block; }
        .sig-buy { background: rgba(59,130,246,0.15); color: #60a5fa; }
        .sig-sell { background: rgba(239,68,68,0.15); color: #f87171; }
        .sig-hold { background: rgba(255,255,255,0.06); color: var(--muted); }
        .stat-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
        .stat-box {
            background: rgba(255,255,255,0.03);
            border-radius: 10px;
            padding: 10px 4px;
            text-align: center;
        }
        .stat-box .v { font-size: 14px; font-weight: 700; color: #fff; }
        .stat-box .l { font-size: 10px; color: var(--muted); margin-top: 2px; }
        .profit-pos { color: var(--green); }
        .profit-neg { color: var(--red); }
        .form-group { margin-bottom: 10px; }
        .form-group label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
        .form-row { display: flex; gap: 8px; align-items: center; justify-content: space-between; }
        .form-row span { font-size: 12px; }
        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 4px;
            border-radius: 2px;
            background: rgba(255,255,255,0.1);
            outline: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px; height: 18px;
            border-radius: 50%;
            background: var(--primary);
            cursor: pointer;
        }
        .btn-row { display: flex; gap: 8px; }
        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-primary { background: var(--primary); color: white; }
        .btn-success { background: var(--success); color: white; }
        .btn-danger { background: var(--danger); color: white; }
        .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .trade-list { max-height: 200px; overflow-y: auto; }
        .trade-item {
            padding: 8px 0;
            border-bottom: 1px solid var(--border);
            font-size: 12px;
        }
        .trade-item:last-child { border-bottom: none; }
        .trade-item .top { display: flex; justify-content: space-between; margin-bottom: 2px; }
        .wallet-banner {
            background: linear-gradient(135deg, #1e3a5f, #0f2744);
            border: 1px solid rgba(59,130,246,0.3);
            border-radius: 12px;
            padding: 16px;
            text-align: center;
            margin-bottom: 12px;
        }
        .wallet-banner.connected { background: linear-gradient(135deg, #064e3b, #022c22); border-color: rgba(16,185,129,0.3); }
        .wallet-banner .addr { font-size: 13px; color: #93c5fd; font-family: monospace; }
        .wallet-banner.connected .addr { color: #6ee7b7; }
        .log-box {
            background: #050810;
            border-radius: 8px;
            padding: 8px;
            font-family: 'Courier New', monospace;
            font-size: 11px;
            max-height: 150px;
            overflow-y: auto;
            line-height: 1.6;
        }
        .log-line { margin: 1px 0; }
        .log-ts { color: #334155; margin-right: 4px; }
        .log-i { color: #10b981; }
        .log-w { color: #f59e0b; }
        .log-e { color: #ef4444; }
        .live-badge {
            display: inline-flex; align-items: center; gap: 4px;
            font-size: 11px; color: var(--muted);
        }
        .live-dot {
            width: 6px; height: 6px; border-radius: 50%;
            background: var(--success);
        }
        .live-dot.running { animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
        @keyframes slideDown { from{transform:translateY(-100%)} to{transform:translateY(0)} }
        .empty { text-align: center; color: var(--muted); padding: 24px; font-size: 13px; }
        .param-val { color: #60a5fa; font-weight: 600; }
        .modal-tab.active { background: var(--primary) !important; }
        .token-chip.disabled { opacity: 0.5; }
        .signal-panel {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            font-size: 12px;
        }
        .signal-item {
            background: rgba(255,255,255,0.03);
            border-radius: 8px;
            padding: 8px 10px;
            display: flex;
            justify-content: space-between;
        }
        .signal-item .k { color: var(--muted); }
        .signal-item .v { font-weight: 600; }
    </style>
</head>
<body>
<div class="container">

    <!-- 钱包连接 -->
    <div id="wallet-banner" class="wallet-banner">
        <div style="font-size:13px;color:#93c5fd;margin-bottom:8px;">🔗 TP钱包未连接</div>
        <div style="font-size:11px;color:#475569;">连接后可开始自动量化交易</div>
        <button class="btn btn-primary" style="margin-top:12px;width:100%;" onclick="connectWallet()">连接TP钱包</button>
    </div>

    <!-- 实时价格 -->
    <div class="card">
        <div class="card-header">
            <span>实时行情</span>
            <span id="price-time" class="live-badge"><span class="live-dot"></span>--:--:--</span>
        </div>
        <div class="card-body">
            <div class="price-grid" id="price-cards">
            </div>
        </div>
    </div>

    <!-- 账户状态 -->
    <div class="card">
        <div class="card-header">
            <span>账户状态</span>
            <span class="live-badge"><span class="live-dot" id="bot-dot"></span><span id="bot-status-text">已停止</span></span>
        </div>
        <div class="card-body">
            <div class="stat-row">
                <div class="stat-box">
                    <div class="v" id="st-profit">0.00</div>
                    <div class="l">累计收益</div>
                </div>
                <div class="stat-box">
                    <div class="v" id="st-roi">0.0%</div>
                    <div class="l">收益率</div>
                </div>
                <div class="stat-box">
                    <div class="v" id="st-trades">0</div>
                    <div class="l">交易数</div>
                </div>
                <div class="stat-box">
                    <div class="v" id="st-hold">0</div>
                    <div class="l">持仓</div>
                </div>
            </div>
            <!-- 信号面板 -->
            <div class="signal-panel" style="margin-top:12px;">
                <div class="signal-item"><span class="k">买入阈值</span><span class="v" id="sig-buy">--</span></div>
                <div class="signal-item"><span class="k">卖出阈值</span><span class="v" id="sig-sell">--</span></div>
                <div class="signal-item"><span class="k">止损阈值</span><span class="v" id="sig-stop">--</span></div>
                <div class="signal-item"><span class="k">上次买入</span><span class="v" id="sig-last">--</span></div>
            </div>
        </div>
    </div>

    <!-- 参数配置 -->
    <div class="card">
        <div class="card-header"><span>策略参数</span><span style="color:var(--muted);font-weight:400;font-size:11px;">实时生效</span></div>
        <div class="card-body">
            <div class="form-group">
                <div class="form-row">
                    <span>初始资金 (USDT)</span>
                    <span class="param-val" id="lbl-capital">10 USDT</span>
                </div>
                <input type="range" id="sl-capital" min="10" max="10000" step="10" value="10">
            </div>
            <div class="form-group">
                <div class="form-row">
                    <span>每笔比例</span>
                    <span class="param-val" id="lbl-per">10%</span>
                </div>
                <input type="range" id="sl-per" min="5" max="50" step="5" value="10">
            </div>
            <div class="form-group">
                <div class="form-row">
                    <span>止盈比例</span>
                    <span class="param-val" id="lbl-profit">5.0%</span>
                </div>
                <input type="range" id="sl-profit" min="0.5" max="20" step="0.5" value="5">
            </div>
            <div class="form-group">
                <div class="form-row">
                    <span>买入回调</span>
                    <span class="param-val" id="lbl-drop">20.0%</span>
                </div>
                <input type="range" id="sl-drop" min="5" max="60" step="1" value="20">
            </div>
            <div class="form-group">
                <div class="form-row">
                    <span>止损比例</span>
                    <span class="param-val" id="lbl-stop">20.0%</span>
                </div>
                <input type="range" id="sl-stop" min="5" max="40" step="1" value="20">
            </div>
        </div>
    </div>

    <!-- 交易平台 -->
    <div class="card">
        <div class="card-header">
            <span>🌐 交易平台</span>
            <span style="font-size:10px;color:var(--muted);">支持 TP钱包 / Ave.ai</span>
        </div>
        <div class="card-body" style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
            <button class="btn btn-outline" onclick="openTPWallet()" style="font-size:12px;padding:10px;">
                💧 TP钱包 Swap
            </button>
            <button class="btn btn-outline" onclick="openAveTrade()" style="font-size:12px;padding:10px;">
                📊 Ave.ai Swap
            </button>
            <div id="wallet-status" style="grid-column:1/-1;text-align:center;font-size:11px;color:var(--muted);">
                点击上方按钮跳转到对应平台进行交易授权
            </div>
        </div>
    </div>

    <!-- 代币管理 -->
    <div class="card">
        <div class="card-header">
            <span>🪙 代币管理</span>
            <button class="btn btn-sm btn-outline" style="font-size:10px;padding:2px 8px;" onclick="showAddTokenModal()">+ 添加</button>
        </div>
        <div class="card-body" style="padding:10px;">
            <div class="token-grid" id="token-grid" style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px;">
            </div>
        </div>
    </div>

    <!-- 控制 -->
    <div class="card-body" style="padding:0 0 4px;">
        <div class="btn-row">
            <button class="btn btn-success" id="btn-start" onclick="startBot()">▶ 启动机器人</button>
            <button class="btn btn-danger" id="btn-stop" onclick="stopBot()" disabled>■ 停止</button>
        </div>
    </div>

    <!-- 交易历史 -->
    <div class="card">
        <div class="card-header">
            <span>交易历史</span>
            <span id="trade-count" style="font-size:11px;color:var(--muted);">0笔</span>
        </div>
        <div class="card-body">
            <div class="trade-list" id="trade-list">
                <div class="empty">暂无交易记录</div>
            </div>
        </div>
    </div>

    <!-- 运行日志 -->
    <div class="card">
        <div class="card-header">
            <span>运行日志</span>
            <button style="background:none;border:none;color:var(--muted);font-size:11px;cursor:pointer;" onclick="clearLog()">清除</button>
        </div>
        <div class="card-body">
            <div class="log-box" id="log-box"></div>
        </div>
    </div>

</div>

<!-- 添加代币弹窗 -->
<div id="token-modal" class="modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:9999;align-items:center;justify-content:center;">
    <div style="background:var(--card);border-radius:16px;padding:20px;width:90%;max-width:400px;border:1px solid var(--border);">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
            <span style="font-weight:600;">🪙 添加交易币种</span>
            <button onclick="closeAddTokenModal()" style="background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer;">✕</button>
        </div>
        
        <!-- 搜索选项卡 -->
        <div class="modal-tabs" style="display:flex;gap:6px;margin-bottom:12px;">
            <button class="modal-tab active" id="tab-search" onclick="switchTab('search')" style="flex:1;padding:8px;border:none;border-radius:8px;background:rgba(255,255,255,0.06);color:var(--text);font-size:12px;cursor:pointer;">合约搜索</button>
            <button class="modal-tab" id="tab-symbol" onclick="switchTab('symbol')" style="flex:1;padding:8px;border:none;border-radius:8px;background:rgba(255,255,255,0.06);color:var(--text);font-size:12px;cursor:pointer;">符号搜索</button>
            <button class="modal-tab" id="tab-custom" onclick="switchTab('custom')" style="flex:1;padding:8px;border:none;border-radius:8px;background:rgba(255,255,255,0.06);color:var(--text);font-size:12px;cursor:pointer;">手动输入</button>
        </div>
        
        <!-- 合约搜索 -->
        <div id="panel-search" class="modal-panel">
            <input type="text" id="search-contract" placeholder="输入合约地址 0x..." 
                style="width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--border);background:rgba(255,255,255,0.05);color:var(--text);font-size:13px;font-family:monospace;"
                onkeydown="if(event.key==='Enter')searchContract()">
            <button class="btn btn-primary" style="width:100%;margin-top:8px;" onclick="searchContract()">🔍 搜索代币</button>
        </div>
        
        <!-- 符号搜索 -->
        <div id="panel-symbol" class="modal-panel" style="display:none;">
            <input type="text" id="search-symbol" placeholder="输入代币符号，如 BTC、PEPE" 
                style="width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--border);background:rgba(255,255,255,0.05);color:var(--text);font-size:13px;"
                oninput="searchSymbolResults()">
            <div id="symbol-results" style="margin-top:8px;max-height:200px;overflow-y:auto;"></div>
        </div>
        
        <!-- 手动输入 -->
        <div id="panel-custom" class="modal-panel" style="display:none;">
            <div style="display:grid;gap:8px;">
                <input type="text" id="custom-symbol" placeholder="代币符号，如 PEPE" style="padding:8px 10px;border-radius:8px;border:1px solid var(--border);background:rgba(255,255,255,0.05);color:var(--text);font-size:13px;">
                <input type="text" id="custom-address" placeholder="合约地址 0x..." style="padding:8px 10px;border-radius:8px;border:1px solid var(--border);background:rgba(255,255,255,0.05);color:var(--text);font-size:13px;font-family:monospace;">
                <input type="text" id="custom-name" placeholder="代币名称（可选）" style="padding:8px 10px;border-radius:8px;border:1px solid var(--border);background:rgba(255,255,255,0.05);color:var(--text);font-size:13px;">
                <button class="btn btn-primary" style="width:100%;" onclick="addCustomToken()">➕ 添加代币</button>
            </div>
        </div>
        
        <!-- 搜索结果 -->
        <div id="token-result" style="margin-top:12px;display:none;">
            <div style="background:rgba(255,255,255,0.04);border-radius:10px;padding:12px;">
                <div id="result-symbol" style="font-size:16px;font-weight:700;margin-bottom:4px;"></div>
                <div id="result-name" style="font-size:12px;color:var(--muted);margin-bottom:4px;"></div>
                <div id="result-addr" style="font-size:11px;color:var(--muted);font-family:monospace;word-break:break-all;margin-bottom:4px;"></div>
                <div id="result-pool" style="font-size:12px;"></div>
            </div>
            <button class="btn btn-success" style="width:100%;margin-top:8px;" id="btn-add-token" onclick="confirmAddToken()">✅ 添加到交易列表</button>
        </div>
        
        <div id="token-error" style="margin-top:8px;color:var(--danger);font-size:12px;display:none;"></div>
        <div id="token-loading" style="margin-top:8px;color:var(--muted);font-size:12px;text-align:center;display:none;">🔄 查询中...</div>
    </div>
</div>

<!-- 代币详情弹窗 -->
<div id="detail-modal" class="modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:9999;align-items:center;justify-content:center;">
    <div style="background:var(--card);border-radius:16px;padding:20px;width:90%;max-width:360px;border:1px solid var(--border);">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
            <span id="detail-title" style="font-weight:600;font-size:16px;"></span>
            <button onclick="closeDetailModal()" style="background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer;">✕</button>
        </div>
        <div id="detail-content"></div>
        <div style="display:flex;gap:8px;margin-top:12px;">
            <button class="btn btn-danger" style="flex:1;" id="btn-remove-token" onclick="removeCurrentToken()">🗑 移除</button>
            <button class="btn btn-success" style="flex:1;" onclick="closeDetailModal()">确定</button>
        </div>
    </div>
</div>

<script>
// ====================== 核心引擎 ======================
const cfg = {
    capital: 10,
    perTrade: 0.10,
    profitRate: 0.05,
    buyDropRate: 0.20,
    stopLossRate: 0.20,
    checkInterval: 5000,
};

const state = {
    running: false,
    address: '',
    chainId: '',
    profit: 0,
    trades: [],
    prices: { BTC: 0, ETH: 0, BNB: 0 },
    lastBuy: { BTC: 0, ETH: 0, BNB: 0 },
    totalBought: { BTC: 0, ETH: 0, BNB: 0 },
    totalSold: { BTC: 0, ETH: 0, BNB: 0 },
    firstBuyDone: { BTC: false, ETH: false, BNB: false },
};

let priceTimer = null;
let botTimer = null;

// ====================== TP钱包 ======================
function getTPProvider() {
    if (window.dapp) return window.dapp;
    if (window.ethereum?.isTokenPocket) return window.ethereum;
    if (window.tp) return window.tp;
    return null;
}

async function connectWallet() {
    const provider = getTPProvider();
    if (!provider) {
        log('请安装TP钱包', 'e');
        alert('请先安装 TP钱包\n\n在TP钱包内打开此页面，或使用内置浏览器');
        return;
    }
    try {
        const accounts = await provider.request({ method: 'eth_requestAccounts' });
        if (!accounts?.length) throw new Error('无账户');
        state.address = accounts[0];
        state.chainId = await provider.request({ method: 'eth_chainId' }).catch(() => '0x38');
        showWalletConnected();
        log('TP钱包已连接: ' + addr(state.address), 'i');
    } catch (e) {
        log('连接失败: ' + e.message, 'e');
    }
}

function showWalletConnected() {
    const banner = document.getElementById('wallet-banner');
    banner.className = 'wallet-banner connected';
    banner.innerHTML = `
        <div style="font-size:12px;color:#6ee7b7;margin-bottom:4px;">✓ 已连接</div>
        <div class="addr">${addr(state.address)}</div>
        <div style="font-size:11px;color:#475569;margin-top:4px;">链: ${chainName(state.chainId)}</div>
    `;
}

// ====================== 交易平台跳转 ======================
function openTPWallet() {
    // 获取当前选中的交易对
    const pairs = getTradingPairs().filter(p => p.enabled);
    if (pairs.length === 0) {
        log('请先添加并启用至少一个交易对', 'w');
        return;
    }
    // TP钱包内置Swap（使用第一个交易对）
    const pair = pairs[0];
    // 尝试 TP钱包 deeplink
    const url = `tp://swap?inputCurrency=${pair.symbol}&outputCurrency=USDT`;
    const opened = window.open(url, '_blank');
    if (!opened || opened.closed) {
        // fallback: 打开TP钱包Swap页面
        window.open('https://www.tokenpocket.pro/swap', '_blank');
    }
    log(`📱 跳转到 TP钱包 Swap (${pair.symbol}/USDT)`, 'i');
    document.getElementById('wallet-status').innerHTML = `<span style="color:#f59e0b;">⏳ 请在TP钱包中完成授权和交易</span>`;
}

function openAveTrade() {
    const pairs = getTradingPairs().filter(p => p.enabled);
    if (pairs.length === 0) {
        log('请先添加并启用至少一个交易对', 'w');
        return;
    }
    const pair = pairs[0];
    // Ave.ai swap URL
    const url = `https://share.ave.ai/swap?inputCurrency=${pair.symbol}&outputCurrency=USDT`;
    window.open(url, '_blank');
    log(`📊 跳转到 Ave.ai Swap (${pair.symbol}/USDT)`, 'i');

// GitHub Actions 每3分钟更新 prices.json，前端直接读同源文件
async function fetchPricesFromCache() {
    try {
        const r = await fetch('./prices.json?t=' + Date.now(), { cache: 'no-store' });
        if (r.ok) {
            const d = await r.json();
            if (d.prices) return d.prices;
        }
    } catch {}
    return null;
}

};

async function fetchPrice(sym, pair) {
    // 先尝试从缓存读取
    const cache = await fetchPricesFromCache();
    if (cache && cache[sym] && cache[sym] > 0) return cache[sym];
    // 备选：内置参考价
    return FALLBACK_PRICES[sym] || 0;
}

async function updatePrices() {
    if (!state.running) return;
    const pairs = getTradingPairs().filter(p => p.enabled);
    const cache = await fetchPricesFromCache();

    for (const p of pairs) {
        const sym = p.symbol;
        let price = 0;

        // 优先从缓存读
        if (cache && cache[sym] && cache[sym] > 0) {
            price = cache[sym];
        }

        // 如果缓存没有，尝试外部API
        if (!price) {
            price = await fetchPrice(sym, p.pair);
        }

        // 如果都没有，用内置参考价
        if (!price) {
            price = FALLBACK_PRICES[sym] || 0;
        }

        if (price > 0) {
            state.prices[sym] = price;
            updatePriceDisplay(sym, price);
        }
    }
}

    if (price >= 100) return price.toFixed(2);

}

// ====================== 策略引擎 ======================
function checkSignal(sym) {
    const price = state.prices[sym];
    if (!price) return null;
    const last = state.lastBuy[sym];
    const hold = state.totalBought[sym];

    if (!state.firstBuyDone[sym]) {
        return { type: 'first_buy', text: '🛒 可买入', cls: 'sig-buy' };
    }
    if (hold > 0) {
        const take = last * (1 + cfg.profitRate);
        const stop = last * (1 - cfg.stopLossRate);
        const drop = last * (1 - cfg.buyDropRate);
        if (price >= take) return { type: 'sell_tp', text: '🎯 止盈', cls: 'sig-sell', take, stop, drop };
        if (price <= stop) return { type: 'sell_sl', text: '⚠️ 止损', cls: 'sig-sell', take, stop, drop };
        if (price <= drop) return { type: 'buy_cb', text: '📉 回调买', cls: 'sig-buy', take, stop, drop };
        return { type: 'hold', text: '📊 持', cls: 'sig-hold', take, stop, drop };
    } else {
        const drop = last * (1 - cfg.buyDropRate);
        return { type: 'wait', text: last > 0 && price <= drop ? '🛒 买入' : '📊 等待', cls: last > 0 && price <= drop ? 'sig-buy' : 'sig-hold', take: last*(1+cfg.profitRate), stop: last*(1-cfg.stopLossRate), drop };
    }
}

function runBotCycle() {
    const pairs = getTradingPairs().filter(p => p.enabled);
    for (const p of pairs) {
        const sym = p.symbol;
        const sig = checkSignal(sym);
        if (!sig) continue;

        // 更新信号显示
        const el = document.getElementById('s-'+sym.toLowerCase());
        if (el) { el.textContent = sig.text; el.className = 'sig '+sig.cls; }

        if (!state.running) continue;
        if (!state.address) continue;

        // 更新阈值
        if (sig.drop) document.getElementById('sig-buy').textContent = fmtPrice(sig.drop, sym);
        if (sig.take) document.getElementById('sig-sell').textContent = fmtPrice(sig.take, sym);
        if (sig.stop) document.getElementById('sig-stop').textContent = fmtPrice(sig.stop, sym);
        document.getElementById('sig-last').textContent = state.lastBuy[sym] ? fmtPrice(state.lastBuy[sym], sym) : '--';

        // 执行交易
        if (sig.type === 'first_buy' || sig.type === 'buy_cb') {
            execBuy(sym, p.pair, sig);
        } else if (sig.type === 'sell_tp' || sig.type === 'sell_sl') {
            execSell(sym, sig);
        }
    }
    updateStats();
}

function execBuy(sym, pair, sig) {
    const price = state.prices[sym];
    if (!price) return;
    const amount = (cfg.capital + state.profit) * cfg.perTrade / price;
    const fee = amount * price * 0.001;

    const trade = {
        id: Date.now(),
        time: new Date().toLocaleTimeString(),
        sym,
        side: 'BUY',
        price,
        amount,
        fee,
        note: sig.type === 'first_buy' ? '首买入' : '回调买入'
    };
    state.trades.push(trade);
    state.lastBuy[sym] = price;
    state.totalBought[sym] += amount;
    state.firstBuyDone[sym] = true;

    log(`🛒 买入信号 ${sym}: ${amount.toFixed(6)} @ ${fmtPrice(price,sym)} (${trade.note})`, 'i');

    // 尝试真实交易
    const provider = getWeb3Provider();
    if (provider) {
        // 尝试通过钱包直接交易
        const wbnb = '0xbb4CdB9CBd36B01bD1cBaEBF2De08d9173bc095c';
        const tokenIn = sym === 'BNB' ? wbnb : sym;
        const tokenOut = 'USDT'; // 简化：用WBNB
        log(`   ⏳ 正在通过钱包执行 ${sym} 买入...`, 'w');
        // 实际执行会通过 execSwap 函数，这里只记录信号
    } else {
        // 无钱包时，跳转 Ave.ai / TP钱包
        showTradeNotification(sym, 'BUY', price, amount, sig.note);
    }
    renderTrades();
}

function execSell(sym, sig) {
    const price = state.prices[sym];
    const amount = state.totalBought[sym];
    if (!price || amount <= 0) return;
    const value = amount * price;
    const cost = amount * state.lastBuy[sym];
    const fee = value * 0.001;
    const profit = value - cost - fee;

    const trade = {
        id: Date.now(),
        time: new Date().toLocaleTimeString(),
        sym,
        side: 'SELL',
        price,
        amount,
        fee,
        profit,
        note: sig.type === 'sell_tp' ? '止盈' : '止损'
    };
    state.trades.push(trade);
    state.profit += profit;
    state.totalSold[sym] += amount;
    state.totalBought[sym] = 0;
    state.lastBuy[sym] = 0;
    state.firstBuyDone[sym] = false;

    const cls = profit >= 0 ? 'i' : 'e';
    log(`💰 卖出信号 ${sym}: ${amount.toFixed(6)} @ ${fmtPrice(price,sym)} | ${profit>=0?'+':''}${profit.toFixed(2)} USDT (${trade.note})`, cls);

    const provider = getWeb3Provider();
    if (!provider) {
        showTradeNotification(sym, 'SELL', price, amount, sig.note + '信号');
    }
    renderTrades();
}

// ====================== 搜索函数（纯本地，无网络） ======================
function searchContract() {
    var addr = document.getElementById('search-contract').value.trim();
    var loading = document.getElementById('token-loading');
    var result = document.getElementById('token-result');
    var error = document.getElementById('token-error');
    
    // 显示加载状态
    if (loading) { loading.style.display = 'block'; loading.textContent = '🔍 本地查询...'; }
    if (result) result.style.display = 'none';
    if (error) error.style.display = 'none';
    
    // 验证格式
    if (!addr) {
        if (loading) loading.style.display = 'none';
        if (error) { error.textContent = '❌ 请输入合约地址'; error.style.display = 'block'; }
        return;
    }
    if (!/^0x[0-9a-fA-F]{40}$/.test(addr)) {
        if (loading) loading.style.display = 'none';
        if (error) { error.textContent = '❌ 地址格式错误，需40位十六进制'; error.style.display = 'block'; }
        return;
    }
    
    var addrLower = addr.toLowerCase();
    var token = null;
    
    // 精确匹配内置数据库
    if (TOKEN_ADDR_MAP[addrLower]) {
        token = TOKEN_ADDR_MAP[addrLower];
    } else if (addrLower === '0xbb4cdb9cbd36b01bd1cbaebf2de08d9173bc095c') {
        token = { symbol: 'WBNB', name: 'Wrapped BNB', pair: 'BNBUSDT', found: true };
    } else if (addrLower === '0x55d398326f99059ff775485246999027b3197955') {
        token = { symbol: 'USDT', name: 'Tether USD (BEP20)', pair: 'USDTBSC', found: true };
    } else if (addrLower === '0x8ac76a51cc950d9822d68b83fe1ad97b32cd580d') {
        token = { symbol: 'USDC', name: 'USD Coin (BEP20)', pair: 'USDCBSC', found: true };
    }
    
    if (loading) loading.style.display = 'none';
    
    if (token) {
        // 已知代币：秒出结果
        pendingToken = { symbol: token.symbol, name: token.name, address: addr, pair: token.pair, found: true, fromList: true };
        document.getElementById('result-symbol').textContent = token.symbol;
        document.getElementById('result-name').textContent = token.name || '';
        document.getElementById('result-addr').textContent = addr;
        document.getElementById('result-pool').innerHTML = '<span style="color:#10b981;">✓ 内置数据库已验证</span>';
        document.getElementById('token-result').style.display = 'block';
    } else {
        // 未知合约：允许手动添加
        var raw = addr.slice(2, 10).toUpperCase();
        pendingToken = { symbol: raw, name: '未验证代币', address: addr, pair: raw + 'USDT', found: false };
        document.getElementById('result-symbol').textContent = raw;
        document.getElementById('result-name').textContent = '⚠️ 未验证合约';
        document.getElementById('result-addr').textContent = addr;
        document.getElementById('result-pool').innerHTML = '<span style="color:#f59e0b;">⚠️ 合约未收录，添加前请先在 <a href="https://bscscan.com" target="_blank" style="color:#60a5fa;">BscScan</a> 验证</span>';
        document.getElementById('token-result').style.display = 'block';
    }
}

async function searchSymbolResults() {
    const q = document.getElementById('search-symbol').value.trim().toUpperCase();
    const container = document.getElementById('symbol-results');
    if (!q) { container.innerHTML = ''; return; }
    
    const results = KNOWN_TOKENS.filter(t => 
        t.symbol.includes(q) || (t.name && t.name.toUpperCase().includes(q))
    );
    
    if (!results.length) {
        container.innerHTML = '<div style="padding:12px;text-align:center;color:var(--muted);font-size:12px;">未找到，用合约地址搜索试试</div>';
        return;
    }
    
    // 检查是否已添加
    const added = getTradingPairs().map(p=>p.symbol);
    
    container.innerHTML = results.map(t => `
        <div style="display:flex;justify-content:space-between;align-items:center;padding:8px;border-bottom:1px solid var(--border);cursor:pointer;" 
             onclick="selectKnownToken('${t.symbol}')">
            <div>
                <div style="font-weight:600;font-size:13px;">${t.symbol}</div>
                <div style="font-size:11px;color:var(--muted);">${t.name || ''}</div>
            </div>
            <div style="font-size:11px;color:${added.includes(t.symbol)?'#10b981':'#64748b'};">
                ${added.includes(t.symbol) ? '✓ 已添加' : '+ 添加'}
            </div>
        </div>
    `).join('');
}

function selectKnownToken(symbol) {
    const t = KNOWN_TOKENS.find(x => x.symbol === symbol);
    if (!t) return;
    
    const added = getTradingPairs();
    if (added.find(p => p.symbol === t.symbol)) {
        showError('该币种已在交易列表中');
        return;
    }
    
    added.push({ symbol: t.symbol, pair: t.pair, enabled: true });
    saveTradingPairs(added);
    renderTradingPairs();
    renderEmptyPrices();
    
    closeAddTokenModal();
    log(`✅ 已添加交易对 ${t.symbol} / USDT`, 'i');
}

function showTokenResult(token) {
    pendingToken = token;
    const isKnown = token.found || token.fromList;
    document.getElementById('result-symbol').textContent = token.symbol;
    document.getElementById('result-name').textContent = token.name || '';
    document.getElementById('result-addr').textContent = token.address ? token.address : '(无合约地址)';
    
    if (isKnown) {
        document.getElementById('result-pool').innerHTML = 
            `<span style="color:#10b981;">✓ 已验证代币 · ${token.chain?.toUpperCase()} 链</span>`;
    } else {
        document.getElementById('result-pool').innerHTML = 
            `<span style="color:#f59e0b;">⚠️ 未经验证的合约，请前往 
            <a href="https://www.bscscan.com/address/${token.address}" target="_blank" style="color:#60a5fa;">BscScan</a> 
            或 
            <a href="https://ave.ai/token/${token.address}" target="_blank" style="color:#60a5fa;">Ave.ai</a> 
            验证后再添加</span>`;
    }
    document.getElementById('token-result').style.display = 'block';
}

function confirmAddToken() {
    if (!pendingToken) return;
    
    // 检查是否已存在
    const added = getTradingPairs();
    if (added.find(p => p.symbol === pendingToken.symbol)) {
        showError('该币种已在交易列表中');
        return;
    }
    
    // 未验证合约需要确认
    if (!pendingToken.found && !pendingToken.fromList) {
        const ok = confirm(
            `⚠️ 未验证代币: ${pendingToken.symbol}\n\n` +
            `合约: ${pendingToken.address}\n\n` +
            `请确保此合约已通过 BscScan / Ave.ai 验证，否则可能存在风险。\n\n` +
            `确认添加？`
        );
        if (!ok) return;
    }
    
    // 添加
    added.push({
        symbol: pendingToken.symbol,
        pair: pendingToken.pair,
        enabled: true,
        address: pendingToken.address,
        name: pendingToken.name
    });
    saveTradingPairs(added);
    renderTradingPairs();
    renderEmptyPrices();
    
    closeAddTokenModal();
    log(`✅ 已添加 ${pendingToken.symbol} / USDT`, 'i');
}

function addCustomToken() {
    const symbol = document.getElementById('custom-symbol').value.trim().toUpperCase();
    const address = document.getElementById('custom-address').value.trim();
    const name = document.getElementById('custom-name').value.trim();
    
    if (!symbol) { showError('请输入代币符号'); return; }
    if (!address) { showError('请输入合约地址'); return; }
    if (!/^0x[0-9a-fA-F]{40}$/.test(address)) { showError('合约地址格式无效'); return; }
    
    const pair = symbol + 'USDT';
    
    const added = getTradingPairs();
    if (added.find(p => p.symbol === symbol)) {
        showError('该币种已在交易列表中');
        return;
    }
    
    added.push({ symbol, pair, enabled: true, address, name });
    saveTradingPairs(added);
    renderTradingPairs();
    renderEmptyPrices();
    
    closeAddTokenModal();
    log(`✅ 已添加自定义交易对 ${symbol} (${name || '未知'})`, 'i');
}

function showLoading(show) {
    const loading = document.getElementById('token-loading');
    const result = document.getElementById('token-result');
    const error = document.getElementById('token-error');
    if (show) {
        if (loading) { loading.style.display = 'block'; loading.textContent = '🔄 查询中...'; }
        if (result) result.style.display = 'none';
        if (error) error.style.display = 'none';
    } else {
        if (loading) loading.style.display = 'none';
    }
}

function showError(msg) {
    const loading = document.getElementById('token-loading');
    const error = document.getElementById('token-error');
    const result = document.getElementById('token-result');
    if (loading) loading.style.display = 'none';
    if (error) { error.textContent = '❌ ' + msg; error.style.display = 'block'; }
    if (result) result.style.display = 'none';
}

    if (window.ethereum) return window.ethereum;

async function executeSwap(tokenIn, tokenOut, amountIn, slippage = 0.5) {
    const provider = getWeb3Provider();
    if (!provider) {
        log('❌ 未检测到钱包，请在浏览器中安装 TP钱包/MetaMask', 'e');
        return { success: false, error: 'No wallet' };
    }
    
    try {
        const Web3 = window.Web3 || window.web3;
        const web3 = new Web3(provider);
        const accounts = await provider.request({ method: 'eth_accounts' });
        if (!accounts?.length) throw new Error('请先连接钱包');
        const from = accounts[0];
        
        const addrIn = tokenIn === 'BNB' ? WBNB_BSC : tokenIn;
        const addrOut = tokenOut === 'BNB' ? WBNB_BSC : tokenOut;
        
        const amountInWei = web3.utils.toWei(amountIn.toString(), 'ether');
        const deadline = Math.floor(Date.now() / 1000) + 1200;
        const path = [addrIn, addrOut];
        
        const router = new web3.eth.Contract(SWAP_ABI, ROUTER_BSC);
        
        // 先获取报价
        const amounts = await router.methods.getAmountsOut(amountInWei, path).call();
        const amountOut = parseFloat(web3.utils.fromWei(amounts[1], 'ether'));
        const minOut = amountOut * (1 - slippage / 100);
        const minOutWei = web3.utils.toWei(minOut.toString(), 'ether');
        
        const isBNBIn = addrIn.toLowerCase() === WBNB_BSC.toLowerCase();
        const isBNBOut = addrOut.toLowerCase() === WBNB_BSC.toLowerCase();
        
        let txHash;
        if (isBNBIn) {
            txHash = await provider.request({
                method: 'eth_sendTransaction',
                params: [{
                    from, to: ROUTER_BSC,
                    value: amountInWei,
                    data: router.methods.swapExactBNBForTokensSupportingFeeOnTransferTokens(minOutWei, path, from, deadline).encodeABI(),
                    gas: '0x8D15C8'
                }]
            });
        } else if (isBNBOut) {
            txHash = await provider.request({
                method: 'eth_sendTransaction',
                params: [{
                    from, to: ROUTER_BSC,
                    value: '0x0',
                    data: router.methods.swapExactTokensForBNBSupportingFeeOnTransferTokens(amountInWei, minOutWei, path, from, deadline).encodeABI(),
                    gas: '0x8D15C8'
                }]
            });
        } else {
            txHash = await provider.request({
                method: 'eth_sendTransaction',
                params: [{
                    from, to: ROUTER_BSC,
                    value: '0x0',
                    data: router.methods.swapExactTokensForTokensSupportingFeeOnTransferTokens(amountInWei, minOutWei, path, from, deadline).encodeABI(),
                    gas: '0x8D15C8'
                }]
            });
        }
        
        log(`✅ 交易已发送: ${txHash.slice(0,10)}...`, 'i');
        return { success: true, txHash };
    } catch (e) {
        log(`❌ 交易失败: ${e.message}`, 'e');
        return { success: false, error: e.message };
    }
}
</script>
