<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TP钱包量化交易机器人</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/css/bootstrap.min.css">
    <style>
        :root {
            --primary: #2196F3;
            --success: #4CAF50;
            --danger: #F44336;
            --warning: #FF9800;
            --bg-dark: #1a1a2e;
            --bg-card: #16213e;
            --text: #eaeaea;
        }
        body {
            background: var(--bg-dark);
            color: var(--text);
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            min-height: 100vh;
        }
        .container { max-width: 960px; }
        .card {
            background: var(--bg-card);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            margin-bottom: 16px;
        }
        .card-header {
            background: transparent;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            font-weight: bold;
        }
        .btn-primary { background: var(--primary); border: none; }
        .btn-success { background: var(--success); border: none; }
        .btn-danger { background: var(--danger); border: none; }
        .btn-warning { background: var(--warning); border: none; color: #000; }
        .price-up { color: #F44336; font-weight: bold; }
        .price-down { color: #4CAF50; font-weight: bold; }
        .stat-card {
            background: rgba(255,255,255,0.05);
            border-radius: 8px;
            padding: 12px;
            text-align: center;
        }
        .stat-value { font-size: 1.5rem; font-weight: bold; color: #fff; }
        .stat-label { font-size: 0.85rem; color: #888; }
        .signal-buy {
            background: linear-gradient(135deg, #2196F3, #1976D2);
            color: white;
            border-radius: 20px;
            padding: 4px 12px;
            font-size: 0.8rem;
        }
        .signal-sell {
            background: linear-gradient(135deg, #F44336, #C62828);
            color: white;
            border-radius: 20px;
            padding: 4px 12px;
            font-size: 0.8rem;
        }
        .signal-hold {
            background: rgba(255,255,255,0.1);
            color: #888;
            border-radius: 20px;
            padding: 4px 12px;
            font-size: 0.8rem;
        }
        .price-ticker {
            font-size: 1.8rem;
            font-weight: bold;
        }
        .chart-container { position: relative; height: 200px; }
        .trade-item {
            border-left: 3px solid var(--primary);
            padding-left: 12px;
            margin-bottom: 8px;
        }
        .config-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .wallet-badge {
            background: rgba(33,150,243,0.2);
            color: #64B5F6;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
        }
        .toast-custom {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            animation: slideIn 0.3s ease;
        }
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        .progress-bar-buy { background: linear-gradient(90deg, #2196F3, #4CAF50); }
        .progress-bar-sell { background: linear-gradient(90deg, #F44336, #FF9800); }
        #log-console {
            background: #0a0a15;
            border-radius: 8px;
            padding: 12px;
            font-family: 'Courier New', monospace;
            font-size: 0.75rem;
            max-height: 200px;
            overflow-y: auto;
        }
        .log-entry { margin: 2px 0; }
        .log-time { color: #666; }
        .log-info { color: #4CAF50; }
        .log-warn { color: #FF9800; }
        .log-error { color: #F44336; }
        .live-dot {
            width: 8px; height: 8px;
            background: #4CAF50;
            border-radius: 50%;
            display: inline-block;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
    </style>
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar navbar-expand-lg navbar-dark" style="background: rgba(0,0,0,0.3);">
        <div class="container">
            <a class="navbar-brand" href="#">🤖 TP量化机器人</a>
            <div class="ml-auto d-flex align-items-center">
                <span id="live-indicator" class="mr-3" style="display:none;">
                    <span class="live-dot"></span> <span id="live-status">LIVE</span>
                </span>
                <button id="btn-connect" class="btn btn-sm btn-primary" onclick="connectWallet()">
                    连接TP钱包
                </button>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <!-- 钱包状态 -->
        <div class="card" id="wallet-card">
            <div class="card-body text-center py-3">
                <div id="wallet-disconnected">
                    <span class="text-muted">🔗 未连接钱包</span>
                    <br>
                    <small class="text-muted">连接TP钱包后开始自动量化交易</small>
                </div>
                <div id="wallet-connected" style="display:none;">
                    <span class="wallet-badge" id="wallet-address"></span>
                    <span class="ml-3" id="wallet-balance"></span>
                    <span class="ml-3" id="wallet-network"></span>
                </div>
            </div>
        </div>

        <!-- 实时行情 -->
        <div class="row">
            <div class="col-md-4">
                <div class="card">
                    <div class="card-body text-center">
                        <div class="stat-label">BTC/USDT</div>
                        <div class="price-ticker" id="price-btc" style="color:#F7931A;">--</div>
                        <div id="signal-btc" class="signal-hold mt-2">监控中</div>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card">
                    <div class="card-body text-center">
                        <div class="stat-label">ETH/USDT</div>
                        <div class="price-ticker" id="price-eth" style="color:#627EEA;">--</div>
                        <div id="signal-eth" class="signal-hold mt-2">监控中</div>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card">
                    <div class="card-body text-center">
                        <div class="stat-label">BNB/USDT</div>
                        <div class="price-ticker" id="price-bnb" style="color:#F3BA2F;">--</div>
                        <div id="signal-bnb" class="signal-hold mt-2">监控中</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 策略状态 -->
        <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
                <span>📊 策略状态</span>
                <div>
                    <button class="btn btn-sm btn-success" onclick="startBot()">▶ 启动</button>
                    <button class="btn btn-sm btn-danger" onclick="stopBot()">■ 停止</button>
                </div>
            </div>
            <div class="card-body">
                <div class="row">
                    <div class="col-3">
                        <div class="stat-card">
                            <div class="stat-value" id="stat-total-profit">0.00</div>
                            <div class="stat-label">累计收益 (USDT)</div>
                        </div>
                    </div>
                    <div class="col-3">
                        <div class="stat-card">
                            <div class="stat-value" id="stat-roi">0.00%</div>
                            <div class="stat-label">收益率</div>
                        </div>
                    </div>
                    <div class="col-3">
                        <div class="stat-card">
                            <div class="stat-value" id="stat-trades">0</div>
                            <div class="stat-label">交易次数</div>
                        </div>
                    </div>
                    <div class="col-3">
                        <div class="stat-card">
                            <div class="stat-value" id="stat-holdings">0</div>
                            <div class="stat-label">当前持仓</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="row">
            <!-- 参数配置 -->
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">⚙️ 策略参数</div>
                    <div class="card-body">
                        <div class="config-item">
                            <span>初始资金 (USDT)</span>
                            <input type="number" id="cfg-capital" value="1000" class="form-control form-control-sm" style="width:120px;">
                        </div>
                        <div class="config-item">
                            <span>每笔交易比例</span>
                            <div class="input-group input-group-sm" style="width:140px;">
                                <input type="number" id="cfg-per-trade" value="10" class="form-control">
                                <div class="input-group-append"><span class="input-group-text">%</span></div>
                            </div>
                        </div>
                        <div class="config-item">
                            <span>止盈比例</span>
                            <div class="input-group input-group-sm" style="width:140px;">
                                <input type="number" id="cfg-profit" value="2" step="0.1" class="form-control">
                                <div class="input-group-append"><span class="input-group-text">%</span></div>
                            </div>
                        </div>
                        <div class="config-item">
                            <span>买入回调比例</span>
                            <div class="input-group input-group-sm" style="width:140px;">
                                <input type="number" id="cfg-drop" value="1.5" step="0.1" class="form-control">
                                <div class="input-group-append"><span class="input-group-text">%</span></div>
                            </div>
                        </div>
                        <div class="config-item">
                            <span>止损比例</span>
                            <div class="input-group input-group-sm" style="width:140px;">
                                <input type="number" id="cfg-stop" value="5" step="0.1" class="form-control">
                                <div class="input-group-append"><span class="input-group-text">%</span></div>
                            </div>
                        </div>
                        <div class="config-item">
                            <span>检查间隔</span>
                            <div class="input-group input-group-sm" style="width:140px;">
                                <input type="number" id="cfg-interval" value="10" class="form-control">
                                <div class="input-group-append"><span class="input-group-text">秒</span></div>
                            </div>
                        </div>
                        <button class="btn btn-sm btn-primary mt-2" onclick="saveConfig()">💾 保存配置</button>
                    </div>
                </div>
            </div>

            <!-- 交易历史 -->
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">📜 交易历史</div>
                    <div class="card-body" style="max-height: 300px; overflow-y: auto;">
                        <div id="trade-history">
                            <div class="text-muted text-center py-4">暂无交易记录</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 实时日志 -->
        <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
                <span>💻 运行日志</span>
                <button class="btn btn-sm btn-outline-secondary" onclick="clearLog()">清除</button>
            </div>
            <div class="card-body">
                <div id="log-console"></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.0/dist/ethers.min.js"></script>
    <script src="tp-wallet.js"></script>
    <script>
        // ========== 全局状态 ==========
        let botState = {
            running: false,
            address: '',
            chainId: '',
            config: {
                initial_capital: 1000,
                per_trade_ratio: 0.1,
                profit_rate: 0.02,
                buy_drop_rate: 0.015,
                stop_loss_rate: 0.05,
                check_interval: 10
            },
            positions: {},
            trades: [],
            profit: 0,
            prices: { BTC: 0, ETH: 0, BNB: 0 },
            lastBuyPrices: { BTC: 0, ETH: 0, BNB: 0 },
            totalBought: { BTC: 0, ETH: 0, BNB: 0 },
            totalSold: { BTC: 0, ETH: 0, BNB: 0 }
        };

        let wsConnection = null;
        let priceInterval = null;

        // ========== TP钱包连接 ==========
        async function connectWallet() {
            const btn = document.getElementById('btn-connect');
            btn.innerHTML = '连接中...';
            btn.disabled = true;

            try {
                const result = await tpWallet.connect();

                if (result.success) {
                    botState.address = result.address;
                    botState.chainId = result.chainId;

                    document.getElementById('wallet-connected').style.display = 'block';
                    document.getElementById('wallet-disconnected').style.display = 'none';
                    document.getElementById('wallet-address').textContent = formatAddress(result.address);
                    document.getElementById('wallet-network').textContent = getNetworkName(result.chainId);

                    // 获取余额
                    const balance = await tpWallet.getBalance(result.address);
                    document.getElementById('wallet-balance').textContent = balance.toFixed(4) + ' BNB';

                    btn.innerHTML = '✓ 已连接';
                    btn.className = 'btn btn-sm btn-success';

                    log('钱包连接成功: ' + formatAddress(result.address), 'info');

                    // 开始获取价格
                    startPriceFeed();

                } else {
                    throw new Error(result.error);
                }
            } catch (error) {
                log('钱包连接失败: ' + error.message, 'error');
                btn.innerHTML = '重试连接';
            }

            btn.disabled = false;
        }

        // ========== 价格获取 ==========
        async function fetchPrice(symbol) {
            try {
                // 使用Binance公开API
                const response = await fetch(`https://api.binance.com/api/v3/ticker/price?symbol=${symbol}USDT`);
                const data = await response.json();
                return parseFloat(data.price);
            } catch (error) {
                return null;
            }
        }

        async function updatePrices() {
            const symbols = [
                { key: 'BTC', symbol: 'BTCUSDT' },
                { key: 'ETH', symbol: 'ETHUSDT' },
                { key: 'BNB', symbol: 'BNBUSDT' }
            ];

            for (const { key, symbol } of symbols) {
                const price = await fetchPrice(symbol);
                if (price) {
                    const oldPrice = botState.prices[key];
                    botState.prices[key] = price;

                    const el = document.getElementById(`price-${key.toLowerCase()}`);
                    if (el) {
                        el.textContent = formatPrice(price, key);
                        el.className = `price-ticker ${price > oldPrice ? 'price-up' : price < oldPrice ? 'price-down' : ''}`;
                    }

                    // 检查交易信号
                    if (botState.running) {
                        checkSignals(key, price);
                    }
                }
            }
        }

        function formatPrice(price, key) {
            if (price >= 1000) return price.toFixed(2);
            if (price >= 1) return price.toFixed(4);
            return price.toFixed(6);
        }

        function startPriceFeed() {
            updatePrices();
            priceInterval = setInterval(updatePrices, 5000);
            document.getElementById('live-indicator').style.display = 'inline-flex';
            log('价格推送已启动', 'info');
        }

        // ========== 交易信号检查 ==========
        function checkSignals(key, currentPrice) {
            const cfg = botState.config;
            const lastBuy = botState.lastBuyPrices[key];
            const signalEl = document.getElementById(`signal-${key.toLowerCase()}`);

            if (lastBuy === 0) {
                // 首次买入机会（价格相对较低时）
                signalEl.className = 'signal-buy';
                signalEl.textContent = '📊 等待买入信号';
                return;
            }

            // 计算各种阈值
            const buyDropThreshold = lastBuy * (1 - cfg.buy_drop_rate);
            const takeProfitThreshold = lastBuy * (1 + cfg.profit_rate);
            const stopLossThreshold = lastBuy * (1 - cfg.stop_loss_rate);

            if (botState.totalBought[key] > 0) {
                // 有持仓
                if (currentPrice >= takeProfitThreshold) {
                    // 止盈信号
                    executeSell(key, currentPrice, 'take_profit');
                    signalEl.className = 'signal-sell';
                    signalEl.textContent = '🎯 止盈信号';
                } else if (currentPrice <= stopLossThreshold) {
                    // 止损信号
                    executeSell(key, currentPrice, 'stop_loss');
                    signalEl.className = 'signal-sell';
                    signalEl.textContent = '⚠️ 止损信号';
                } else if (currentPrice <= buyDropThreshold) {
                    // 回调买入信号
                    executeBuy(key, currentPrice, 'callback_buy');
                    signalEl.className = 'signal-buy';
                    signalEl.textContent = '📉 回调买入信号';
                } else {
                    signalEl.className = 'signal-hold';
                    signalEl.textContent = '📊 持仓中';
                }
            } else {
                // 无持仓
                if (currentPrice <= buyDropThreshold) {
                    executeBuy(key, currentPrice, 'init_buy');
                    signalEl.className = 'signal-buy';
                    signalEl.textContent = '🛒 买入信号';
                } else {
                    signalEl.className = 'signal-hold';
                    signalEl.textContent = '📊 等待机会';
                }
            }
        }

        function executeBuy(key, price, reason) {
            const cfg = botState.config;
            const tradeAmount = (botState.config.initial_capital + botState.profit) * cfg.per_trade_ratio / price;
            const value = tradeAmount * price;

            const trade = {
                id: Date.now(),
                time: new Date().toLocaleString(),
                symbol: key + '/USDT',
                side: 'BUY',
                price: price,
                amount: tradeAmount,
                value: value,
                reason: reason
            };

            botState.trades.push(trade);
            botState.lastBuyPrices[key] = price;
            botState.totalBought[key] += tradeAmount;

            log(`🛒 买入 ${key}: ${tradeAmount.toFixed(6)} @ ${price} (${reason})`, 'info');
            updateTradeHistory();
            updateStats();
        }

        function executeSell(key, price, reason) {
            const amount = botState.totalBought[key];
            if (amount <= 0) return;

            const avgBuyPrice = botState.lastBuyPrices[key];
            const value = amount * price;
            const cost = amount * avgBuyPrice;
            const profit = value - cost;
            const fee = value * 0.001;

            const trade = {
                id: Date.now(),
                time: new Date().toLocaleString(),
                symbol: key + '/USDT',
                side: 'SELL',
                price: price,
                amount: amount,
                value: value,
                profit: profit - fee,
                reason: reason
            };

            botState.trades.push(trade);
            botState.profit += profit - fee;
            botState.totalSold[key] += amount;
            botState.totalBought[key] = 0;
            botState.lastBuyPrices[key] = 0;

            log(`💰 卖出 ${key}: ${amount.toFixed(6)} @ ${price} | 盈利: ${(profit - fee).toFixed(2)} USDT (${reason})`, 'info');
            updateTradeHistory();
            updateStats();
        }

        // ========== UI更新 ==========
        function updateTradeHistory() {
            const container = document.getElementById('trade-history');
            if (botState.trades.length === 0) {
                container.innerHTML = '<div class="text-muted text-center py-4">暂无交易记录</div>';
                return;
            }

            container.innerHTML = botState.trades.slice().reverse().slice(0, 20).map(trade => {
                const isBuy = trade.side === 'BUY';
                const profitStr = trade.profit !== undefined ? `<span class="${trade.profit >= 0 ? 'text-success' : 'text-danger'}">${trade.profit >= 0 ? '+' : ''}${trade.profit.toFixed(2)}</span>` : '';
                return `
                    <div class="trade-item">
                        <div class="d-flex justify-content-between">
                            <span class="${isBuy ? 'text-primary' : 'text-danger'}">${isBuy ? '🛒买入' : '💰卖出'}</span>
                            <span>${trade.time}</span>
                        </div>
                        <div class="small">
                            ${trade.symbol} | ${trade.amount.toFixed(4)} @ ${trade.price}
                            ${profitStr ? `| ${profitStr} USDT` : ''}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function updateStats() {
            document.getElementById('stat-total-profit').textContent = botState.profit.toFixed(2);
            document.getElementById('stat-roi').textContent = ((botState.profit / botState.config.initial_capital) * 100).toFixed(2) + '%';
            document.getElementById('stat-trades').textContent = botState.trades.length;

            let totalHoldings = 0;
            for (const key in botState.totalBought) {
                totalHoldings += botState.totalBought[key];
            }
            document.getElementById('stat-holdings').textContent = totalHoldings.toFixed(4);
        }

        // ========== 启动/停止 ==========
        function startBot() {
            if (!botState.address) {
                toast('请先连接TP钱包', 'warning');
                return;
            }
            botState.running = true;
            document.getElementById('live-status').textContent = 'RUNNING';
            log('量化机器人已启动', 'info');
            toast('机器人已启动 🟢', 'success');
        }

        function stopBot() {
            botState.running = false;
            document.getElementById('live-status').textContent = 'STOPPED';
            document.getElementById('live-indicator').querySelector('.live-dot').style.background = '#FF9800';
            log('量化机器人已停止', 'warn');
            toast('机器人已停止 🟡', 'warning');
        }

        // ========== 配置保存 ==========
        function saveConfig() {
            botState.config = {
                initial_capital: parseFloat(document.getElementById('cfg-capital').value) || 1000,
                per_trade_ratio: (parseFloat(document.getElementById('cfg-per-trade').value) || 10) / 100,
                profit_rate: (parseFloat(document.getElementById('cfg-profit').value) || 2) / 100,
                buy_drop_rate: (parseFloat(document.getElementById('cfg-drop').value) || 1.5) / 100,
                stop_loss_rate: (parseFloat(document.getElementById('cfg-stop').value) || 5) / 100,
                check_interval: parseInt(document.getElementById('cfg-interval').value) || 10
            };
            localStorage.setItem('tpQuantConfig', JSON.stringify(botState.config));
            log('配置已保存', 'info');
            toast('配置已保存 ✅', 'success');
        }

        function loadConfig() {
            const saved = localStorage.getItem('tpQuantConfig');
            if (saved) {
                botState.config = JSON.parse(saved);
                document.getElementById('cfg-capital').value = botState.config.initial_capital;
                document.getElementById('cfg-per-trade').value = (botState.config.per_trade_ratio * 100).toFixed(0);
                document.getElementById('cfg-profit').value = (botState.config.profit_rate * 100).toFixed(1);
                document.getElementById('cfg-drop').value = (botState.config.buy_drop_rate * 100).toFixed(1);
                document.getElementById('cfg-stop').value = (botState.config.stop_loss_rate * 100).toFixed(1);
                document.getElementById('cfg-interval').value = botState.config.check_interval;
            }
        }

        // ========== 日志 ==========
        function log(message, level = 'info') {
            const console = document.getElementById('log-console');
            const time = new Date().toLocaleTimeString();
            const entry = document.createElement('div');
            entry.className = `log-entry log-${level}`;
            entry.innerHTML = `<span class="log-time">[${time}]</span> ${message}`;
            console.appendChild(entry);
            console.scrollTop = console.scrollHeight;
        }

        function clearLog() {
            document.getElementById('log-console').innerHTML = '';
            log('日志已清除', 'info');
        }

        // ========== 工具函数 ==========
        function formatAddress(addr) {
            return addr ? `${addr.substring(0,6)}...${addr.substring(addr.length-4)}` : '';
        }

        function getNetworkName(chainId) {
            const networks = {
                '0x38': 'BSC',
                '0x1': 'Ethereum',
                '0x56': 'BSC',
                '0x61': 'BSC Testnet',
                '0x97': 'BSC Testnet'
            };
            return networks[chainId] || 'Unknown';
        }

        function toast(message, type = 'info') {
            const colors = {
                info: 'info',
                success: 'success',
                warning: 'warning',
                error: 'danger'
            };
            const html = `<div class="toast toast-custom alert alert-${colors[type]} alert-dismissible fade show" role="alert">
                ${message}
                <button type="button" class="close" data-dismiss="alert">&times;</button>
            </div>`;
            document.body.insertAdjacentHTML('beforeend', html);
            setTimeout(() => document.querySelector('.toast-custom')?.remove(), 3000);
        }

        // ========== 初始化 ==========
        window.onload = function() {
            loadConfig();
            log('TP钱包量化机器人初始化完成', 'info');
            log('请先连接TP钱包开始交易', 'info');
        };
    </script>
</body>
</html>
